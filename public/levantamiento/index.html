<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#077580">
<title>Eunomi · Levantamiento</title>
<link rel="manifest" href="/levantamiento.webmanifest">
<link rel="icon" href="/brand-mark.svg">
<style>
:root{--t:#077580;--td:#05545c;--tl:#e6f1f1;--bg:#f6f8f8;--card:#fff;--tx:#1b1b1b;--mu:#5d6b6d;--bd:#d3dfe0;--warn:#fff4e0;--warnb:#e0a040;--ok:#e8f6ee;--okb:#3c9a63;--red:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--t);color:#fff}
.bar>div{flex:1;min-width:0}
.bar b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span{font-size:12.5px;opacity:.85}
.back{background:none;border:0;color:#fff;font-size:24px;padding:4px 8px;min-height:44px}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 90px}
h2{font-size:20px;margin:6px 0 10px;color:var(--td)}
h2 small{display:block;font-size:13px;font-weight:normal;color:var(--mu)}
h3{font-size:15px;margin:18px 0 6px;color:var(--td)}
.muted{color:var(--mu)}.small{font-size:13px}
.primary,.ghost,.danger{border-radius:10px;padding:11px 16px;min-height:46px;border:1px solid var(--t);cursor:pointer}
.primary{background:var(--t);color:#fff;font-weight:600}
.ghost{background:#fff;color:var(--td)}
.ghost.light{background:transparent;color:#fff;border-color:#ffffff99}
.danger{background:#fff;color:var(--red);border-color:#e4b4b0}
.small{min-height:38px;padding:6px 12px;font-size:14px}
.big{width:100%;font-size:18px;padding:16px;margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}.filebtn input{display:none}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cards li{display:flex;gap:8px;align-items:stretch}
.card{flex:1;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;min-width:0}
.card strong{display:block;font-size:16.5px}.card small{display:block;color:var(--mu)}
.meta{font-size:12.5px;color:var(--mu)}
.prog{display:block;height:5px;background:var(--tl);border-radius:3px;margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--t)}
.empty{background:#fff;border:1px dashed var(--bd);border-radius:12px;padding:16px;color:var(--mu)}
.panel{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:14px}
.panel h3{margin-top:0}
input,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;background:#fff;min-height:46px}
input:focus,textarea:focus{outline:2px solid var(--t);border-color:var(--t)}
textarea{resize:vertical}
.secs,.tabs{position:sticky;top:64px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--bd);scrollbar-width:none}
.secs::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.secs button,.tabs button{flex:none;border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 12px;font-size:13.5px;white-space:nowrap;cursor:pointer;min-height:36px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px}.tabs button{padding:6px 2px;font-size:13px;text-align:center}
.secs button.on,.tabs button.on{background:var(--t);color:#fff;border-color:var(--t)}
.fase{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t);margin:4px 0 0}
.tip{background:var(--tl);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.say{font-style:italic;border-left:3px solid var(--t);padding:4px 10px;margin:0 0 12px;color:#333;background:#fff;border-radius:0 8px 8px 0}
.q{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin:0 0 10px}
.ql{display:block;font-weight:600;margin-bottom:6px}.ql em{color:var(--red);font-style:normal}
.q>small{display:block;margin:-3px 0 6px}
.k{display:inline-block;background:var(--t);color:#fff;border-radius:5px;padding:0 6px;font-size:13px}
.num{display:flex;align-items:center;gap:6px}.num span{color:var(--mu);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:8px 13px;min-height:40px;cursor:pointer;font-size:15px}
.chip.on{background:var(--t);border-color:var(--t);color:#fff}
.scale{display:flex;align-items:center;gap:10px;justify-content:space-between}
.scale .ql{margin:0;flex:1}
.dots{display:flex;gap:5px}
.dot{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600}
.dot.on{background:var(--t);border-color:var(--t);color:#fff}
.dot[data-n="0"].on{background:#8a9a9c;border-color:#8a9a9c}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav .primary{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1b1b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
/* Resultado */
.doc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px}
.doc h1{font-size:21px;margin:0 0 2px;color:var(--td)}
.doc h2{font-size:16px;margin:16px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--t)}
blockquote{margin:10px 0;padding:8px 12px;background:var(--tl);border-radius:8px;font-style:italic}
.kv{width:100%;border-collapse:collapse;font-size:14.5px}
.kv th{text-align:left;color:var(--mu);font-weight:600;padding:5px 8px 5px 0;vertical-align:top;width:36%}
.kv td{padding:5px 0;border-bottom:1px solid #eef2f2}
.bars{list-style:none;padding:0;margin:0}.bars li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #eef2f2}
.bars i{font-style:normal;letter-spacing:2px;color:var(--t);white-space:nowrap}.bars i.lv3{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{border:1px solid var(--bd);border-radius:10px;padding:10px}.stat small{color:var(--mu);display:block}.stat b{display:block;font-size:18px;color:var(--td)}.stat span{font-size:13px;color:var(--mu)}
.warn{background:var(--warn);border-left:4px solid var(--warnb);padding:9px 12px;border-radius:8px;margin-top:14px;font-size:14.5px}
.ok{background:var(--ok);border-left:4px solid var(--okb);padding:9px 12px;border-radius:8px;margin-top:14px}
.pre{white-space:pre-wrap}
.sol{border:1px solid var(--bd);border-left:5px solid #b9c7c8;border-radius:10px;padding:10px 12px;margin:10px 0}
.sol.palta{border-left-color:var(--t)}.sol.pmedia{border-left-color:#5aa9b0}
.sol header{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sol header b{flex:1 1 100%;font-size:16px}
.sol p{margin:6px 0}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:12px;padding:1px 8px;color:var(--mu);white-space:nowrap}
.tag.demo{background:var(--ok);border-color:var(--okb);color:#1f6b40}
.why{font-size:14px}.notes{margin:4px 0 0;padding-left:18px;font-size:14px;color:#334}
.inputs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.inputs span{background:var(--tl);border-radius:8px;padding:3px 8px;font-size:14px}
.calc{width:100%;border-collapse:collapse;margin-top:12px;font-size:14.5px}
.calc th{text-align:left;font-size:13px;color:var(--mu);border-bottom:2px solid var(--t);padding:4px}
.calc td{border-bottom:1px solid #eef2f2;padding:6px 4px;vertical-align:top}
.calc td:last-child{text-align:right;white-space:nowrap;font-weight:600}
.calc td small{display:block;color:var(--mu);font-size:12.5px}
.calc tr.hl td{background:var(--tl)}
.actions{margin-top:16px}
.pro{margin:6px 0 10px}.pro p{margin:2px 0}
.firma{margin-top:22px}
.q.palabras{background:#fbfaf5;border-color:#e6dfc7}.q.palabras textarea{font-style:italic;background:#fffef9}
.q.interno{border-style:dashed}
.tagint{font-size:11px;font-weight:600;color:#7a4d00;background:var(--warn);border-radius:8px;padding:0 6px;margin-left:4px}
.tiporeu{font-size:13px;color:var(--td);background:var(--tl);border-radius:8px;padding:6px 10px;margin:0 0 6px}
.tipos{display:grid;gap:10px}
.tipo{display:block;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer}
.tipo b{display:block;font-size:17px;color:var(--td)}.tipo small{display:block;color:var(--mu);margin-bottom:4px}.tipo span{font-size:14.5px}
.tipo.sug{border:2px solid var(--t)}
.nro{display:inline-block;background:#fff;color:var(--t);border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:12px}
.tabs button i{display:block;font-style:normal;font-size:10.5px;opacity:.75}
.interno-banner{background:var(--warn);color:#7a4d00;border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.acta-estado{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}.acta-estado p{margin:0 0 6px}
.acta-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px solid var(--t);padding-bottom:6px;margin-bottom:8px}
.acta-h small{color:var(--mu);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.acta-h span{background:var(--tl);color:var(--td);border-radius:12px;padding:2px 10px;font-size:13px;white-space:nowrap}
.acta ul.dato{list-style:none;padding:0;margin:4px 0}.acta ul.dato li{padding:4px 0;border-bottom:1px solid #eef2f2}
.acta ul.dato li span{color:var(--mu)}
.acta .prio li{font-weight:600}
.acta .conf{font-size:11px;font-weight:normal;color:#7a4d00;background:var(--warn);border-radius:8px;padding:1px 6px;vertical-align:middle}
.acta .nota{font-size:13px;color:var(--mu);border-top:1px solid var(--bd);padding-top:8px;margin-top:16px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.scale{flex-direction:column;align-items:flex-start}}
@media print{
  body{background:#fff;font-size:11pt}
  .noprint,.bar,.tabs,.secs,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .doc{border:0;padding:0}
  .sol,.pro,tr,.acta li,blockquote{break-inside:avoid}
  .acta h2{break-after:avoid}
  @page{size:Letter;margin:14mm}
}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Cargando…</p></div>
<noscript>Esta herramienta necesita JavaScript.</noscript>
<script>
/* Eunomi · Levantamiento · modelo común (app, administrador y guía en papel).
   Cambiar preguntas aquí y reconstruir. Cada entrevista es UNA reunión de un tipo:
   descubrimiento (primera), profundizacion o propuesta. Cada sección dice en qué reuniones aparece.
   interno: 1 → nunca sale en el acta para el cliente. */
var LEV_MODEL = {
  version: 2,
  reuniones: [
    { id: "descubrimiento", nombre: "Descubrimiento", corto: "Primera reunión",
      detalle: "Conocer el local, cómo trabaja y qué le gustaría mejorar. Sin números ni propuestas. ~30 min.",
      objetivo: "Conocer cómo trabaja el local y qué le gustaría mejorar, antes de proponer cualquier solución." },
    { id: "profundizacion", nombre: "Profundización", corto: "Segunda reunión",
      detalle: "Sistema de caja, datos del negocio y cómo validar compras. Solo si hubo interés.",
      objetivo: "Entender en detalle el sistema de ventas y los datos del negocio para diseñar una propuesta ajustada." },
    { id: "propuesta", nombre: "Propuesta", corto: "Reunión de propuesta",
      detalle: "Presentar la solución, acordar el piloto y conversar el precio con sus números.",
      objetivo: "Revisar juntos la propuesta y acordar las condiciones de un piloto." }
  ],
  fases: {
    entender: "Entender · escuchar, no proponer",
    detalle: "Detalle del negocio",
    proponer: "Propuesta",
    acordar: "Cierre y acuerdos"
  },
  secciones: [
    {
      id: "local", fase: "entender", titulo: "Inicio y permiso", tema: "Participantes", reuniones: ["descubrimiento", "profundizacion", "propuesta"],
      decir: "“Gracias por el tiempo. Voy a tomar notas para no olvidar nada; al final te envío una copia de lo conversado para que la revises y me corrijas si algo no quedó bien. ¿Te parece?”",
      preguntas: [
        { id: "nombre", t: "text", q: "Nombre del local", req: 1 },
        { id: "comuna", t: "text", q: "Comuna / sector" },
        { id: "tipo", t: "single", q: "Tipo de local", op: ["Restaurante", "Picada / cocinería", "Café", "Bar", "Comida rápida", "Food truck", "Otro"] },
        { id: "entrevistado", t: "text", q: "Entrevistado/a" },
        { id: "cargo", t: "single", q: "Cargo", op: ["Dueño/a", "Socio/a", "Administrador/a", "Encargado/a", "Otro"] },
        { id: "asistentes", t: "text", q: "Otras personas presentes" },
        { id: "permiso", t: "single", q: "¿Acepta notas y copia de lo conversado?", op: ["Sí", "Notas sí, copia no", "Prefiere sin notas"] },
        { id: "decide", t: "text", q: "¿Quién toma las decisiones del local?", interno: 1 },
        { id: "usuario", t: "text", q: "¿Quién usaría una herramienta día a día?" }
      ]
    },
    {
      id: "central", fase: "entender", titulo: "La pregunta central", tema: "Lo que más quiere mejorar", nota: "dejar hablar, no interrumpir",
      reuniones: ["descubrimiento"],
      decir: "“Eunomi viene de ‘buen orden’: ayudo a negocios locales a ordenar sus procesos y mejorar la experiencia de sus clientes. Antes de proponer nada, quiero entender cómo trabajan.”",
      preguntas: [
        { id: "una_cosa", t: "area", q: "Si pudieras mejorar una sola cosa del local, ¿qué sería? (anotar con sus palabras)", req: 1, lineas: 3 }
      ]
    },
    {
      id: "negocio", fase: "entender", titulo: "El negocio", tema: "El negocio", nota: "tamaño aproximado, sin cifras exactas", reuniones: ["descubrimiento"], palabras: 1,
      preguntas: [
        { id: "mesas_local", t: "number", q: "Mesas en el local" },
        { id: "personal", t: "number", q: "Personas trabajando (turno normal)" },
        { id: "anios", t: "number", q: "Años funcionando" },
        { id: "cuenta_rango", t: "single", q: "Cuenta promedio por mesa (aprox.)", op: ["Menos de $15.000", "$15.000 – $30.000", "$30.000 – $50.000", "Más de $50.000", "Prefiere no decir"] },
        { id: "temporada", t: "single", q: "Diferencia entre temporada alta y baja", op: ["Muy fuerte", "Moderada", "Casi no hay"] },
        { id: "epoca_dificil", t: "text", q: "¿Época o días más difíciles?" }
      ]
    },
    {
      id: "clientes", fase: "entender", titulo: "Sus clientes", tema: "Sus clientes", reuniones: ["descubrimiento"], palabras: 1,
      preguntas: [
        { id: "tipos", t: "multi", q: "¿Quién viene principalmente?", op: ["Residentes", "Turistas chilenos", "Extranjeros", "Familias", "Parejas", "Grupos / delegaciones", "Trabajadores / empresas", "Eventos"] },
        { id: "reconocen", t: "single", q: "¿Reconocen a clientes habituales?", op: ["Sí, a muchos", "A algunos", "Casi no"] },
        { id: "vuelven_rango", t: "single", q: "¿Cuántos clientes vuelven?", op: ["Pocos", "Cerca de la mitad", "La mayoría", "No sabe"] },
        { id: "prioridad", t: "single", q: "¿Qué le importa más?", op: ["Que el turista vuelva en la misma estadía", "Que el cliente local vuelva varias veces al año", "Ambos", "Atraer clientes nuevos"] }
      ]
    },
    {
      id: "venta", fase: "entender", titulo: "Cómo es una venta", tema: "Cómo es una venta", nota: "pedido → cuenta → pago → comprobante", reuniones: ["descubrimiento"], palabras: 1,
      preguntas: [
        { id: "pedido", t: "single", q: "¿Cómo se toma el pedido?", op: ["Garzón con papel", "Garzón con app / tablet", "En el mostrador", "El cliente pide solo (QR / tótem)"] },
        { id: "cobra", t: "single", q: "¿Quién cobra?", op: ["Garzón en la mesa", "Caja", "Ambos"] },
        { id: "pago", t: "multi", q: "Formas de pago", op: ["Efectivo", "Tarjeta", "Transferencia", "Otro"] },
        { id: "comprobante", t: "multi", q: "El cliente recibe", op: ["Boleta impresa", "Boleta electrónica", "Boleta de la máquina de tarjeta", "Solo voucher", "Nada"] },
        { id: "registro_total", t: "multi", q: "¿Dónde queda registrado el total de cada cuenta?", op: ["Programa de comandas / caja", "Máquina de tarjeta", "Boleta (SII)", "Cuaderno / planilla"] }
      ]
    },
    {
      id: "canales", fase: "entender", titulo: "Contacto, reservas y reputación", tema: "Contacto con clientes y reservas", reuniones: ["descubrimiento"], palabras: 1,
      preguntas: [
        { id: "contacto", t: "multi", q: "¿Cómo se comunican con sus clientes?", op: ["WhatsApp", "Instagram", "Facebook", "Email", "Ninguna"] },
        { id: "base", t: "single", q: "¿Tienen un registro de clientes?", op: ["Sí, ordenado", "Sí, desordenado", "No"] },
        { id: "reservas", t: "multi", q: "¿Cómo reciben reservas?", op: ["Teléfono", "WhatsApp", "Instagram", "Plataforma", "No toman reservas"] },
        { id: "google", t: "single", q: "Reseñas en Google", op: ["Muchas y buenas", "Pocas", "Algunas malas", "No sabe"] },
        { id: "hacen_hoy", t: "multi", q: "¿Qué hacen hoy para que los clientes vuelvan?", op: ["Descuentos", "Promociones", "Tarjeta física", "Premios", "Concursos", "Nada"] },
        { id: "funciono", t: "text", q: "¿Qué funcionó y qué no?" }
      ]
    },
    {
      id: "dolores", fase: "entender", titulo: "Lo que hacen a mano · buen orden", tema: "Tareas que hoy cuestan", nota: "marcar solo lo que mencione", reuniones: ["descubrimiento"],
      decir: "“¿Qué hacen hoy a mano (papel, WhatsApp, Excel) que les quite tiempo o genere errores?” Pedir un ejemplo concreto de cada tema. Al final: “De todo esto, ¿qué es lo más urgente para ti?”",
      preguntas: [
        { id: "d_vuelven", t: "scale", q: "Clientes que no vuelven", sol: "fidelizacion" },
        { id: "d_temporada", t: "scale", q: "Temporada baja / días flojos", sol: "temporada" },
        { id: "d_reservas", t: "scale", q: "Reservas y lista de espera", sol: "reservas" },
        { id: "d_eventos", t: "scale", q: "Eventos, grupos y cotizaciones", sol: "eventos" },
        { id: "d_inventario", t: "scale", q: "Inventario y mermas", sol: "inventario" },
        { id: "d_proveedores", t: "scale", q: "Pedidos a proveedores", sol: "proveedores" },
        { id: "d_turnos", t: "scale", q: "Turnos y coordinación del personal", sol: "turnos" },
        { id: "d_reportes", t: "scale", q: "Saber cuánto se vende y gana", sol: "reportes" },
        { id: "d_caja", t: "scale", q: "Cuadratura de caja", sol: "caja" },
        { id: "d_resenas", t: "scale", q: "Reseñas, Google y redes", sol: "resenas" },
        { id: "d_otro", t: "text", q: "Otro tema (cuál)" },
        { id: "d_ejemplos", t: "area", q: "Ejemplos que dio, con sus palabras", lineas: 3 },
        { id: "urgente", t: "rank", q: "Lo más urgente para el cliente (tocar en orden: 1.º, 2.º, 3.º)", de: "dolores" }
      ]
    },
    {
      id: "sistema", fase: "detalle", titulo: "Programa y sistemas", tema: "Sistema de ventas y equipos", nota: "define qué se puede automatizar", reuniones: ["profundizacion"], palabras: 1,
      preguntas: [
        { id: "programa", t: "text", q: "Programa de comandas / caja (si tienen)" },
        { id: "proveedor", t: "text", q: "Proveedor / soporte" },
        { id: "numero_unico", t: "single", q: "¿La boleta tiene número único?", op: ["Sí", "No", "No sabe"] },
        { id: "reporte", t: "single", q: "¿Saca un reporte de ventas del día?", op: ["Sí", "No", "No sabe"] },
        { id: "exporta", t: "single", q: "¿Exporta a Excel/CSV o tiene conexión (API)?", op: ["Sí", "No", "No sabe"] },

  function mismoContenido(a, b) { return JSON.stringify(a || {}) === JSON.stringify(b || {}); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fecha(t) { var d = new Date(t); return d.toLocaleDateString("es-CL", { day: "2-digit", month: "2-digit", year: "numeric" }); }
  function money(n) { return L.money(n); }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  /* ---------- Lista ---------- */
  function vLista() {
    var items = db.items.slice().sort(function (a, b) { return b.actualizado - a.actualizado; });
    return '<header class="bar"><div><b>Eunomi</b><span>Levantamiento de restaurantes</span></div></header>' +
      '<main class="wrap">' +
      '<button class="primary big" data-a="nueva">+ Nueva entrevista</button>' +
      (items.length ? '<ul class="cards">' + items.map(function (x) {
        var p = L.progreso(x.v, M, U.tipoDe(x));
        return '<li><button class="card" data-a="abrir" data-id="' + x.id + '"><strong>' + esc(x.v.nombre || "Local sin nombre") + '</strong>' +
          '<small>' + esc([U.reunion(U.tipoDe(x)).nombre, x.v.comuna, x.v.entrevistado].filter(Boolean).join(" · ")) + '</small>' +
          '<span class="meta">' + fecha(x.creado) + ' · ' + p + '% · ' + U.estadoActaCorto(x) + '</span><span class="prog"><i style="width:' + p + '%"></i></span></button>' +
          '<button class="ghost small" data-a="resultado" data-id="' + x.id + '">Acta</button></li>';
      }).join("") + '</ul>' : '<p class="empty">Aún no hay entrevistas. Empieza una al llegar al local: se guarda sola en este celular.</p>') +
      '<section class="panel"><h3>Respaldo</h3><p class="muted">Las entrevistas quedan <b>solo en este dispositivo</b>, sin internet. Exporta un respaldo después de cada visita.</p>' +
      '<div class="row"><button class="ghost" data-a="exportar">Exportar todo</button><label class="ghost filebtn">Importar<input type="file" accept="application/json,.json" id="imp"></label></div></section>' +
      '<section class="panel"><h3>Tu contacto</h3><p class="muted">Aparece al pie del acta para el cliente.</p><input id="contacto" value="' + esc(db.ajustes.contacto) + '" placeholder="Ej. Iván Bozo · +56 9 … · correo"></section>' +
      '</main>';
  }

  /* ---------- Nueva entrevista: tipo de reunión ---------- */
  function vTipo() {
    var ult = {};
    db.items.forEach(function (x) { var k = (x.v.nombre || "").trim(); if (k && (!ult[k] || x.creado > ult[k].creado)) ult[k] = x; });
    var base = Object.keys(ult).map(function (k) { return ult[k]; });
    var bx = db.items.filter(function (z) { return z.id === st.base; })[0];
    var sug = bx ? (U.tipoDe(bx) === "descubrimiento" ? "profundizacion" : "propuesta") : "descubrimiento";
    return '<header class="bar"><button class="back" data-a="lista" aria-label="Volver">←</button><div><b>Nueva entrevista</b><span>¿Qué reunión es?</span></div></header><main class="wrap">' +
      (base.length ? '<h3>¿Es un local que ya visitaste?</h3><div class="chips">' + base.map(function (x) {
        return '<button class="chip' + (st.base === x.id ? " on" : "") + '" data-a="base" data-id="' + x.id + '">' + esc(x.v.nombre) + '</button>';
      }).join("") + '</div><p class="muted small">Si eliges uno, se copian sus datos básicos.</p>' : '') +
      '<h3>Tipo de reunión</h3>' + U.elegirTipo(sug) + '</main>';
  }

  /* ---------- Entrevista ---------- */
  /* ---------- Entrevista ---------- */
  function vEditar() {
    var x = actual(), p = L.progreso(x.v, M, U.tipoDe(x));
    return '<header class="bar"><button class="back" data-a="lista" aria-label="Volver">←</button><div><b>' + esc(x.v.nombre || "Nueva entrevista") + '</b><span>' + p + '% respondido · se guarda solo</span></div><button class="ghost small light" data-a="resultado" data-id="' + x.id + '">Resultado</button></header>' +
      U.secsNav(x, st.sec) + '<main class="wrap">' + U.seccion(x, st.sec) + '</main>';
  }

  /* ---------- Resultado ---------- */
  function vResultado() {
    var x = actual(), v = x.v;
    return '<header class="bar noprint"><button class="back" data-a="editar" aria-label="Volver a la entrevista">←</button><div><b>' + esc(v.nombre || "Local sin nombre") + '</b><span>Acta y análisis</span></div></header>' +
      U.tabsNav(x, st.tab) + '<main class="wrap">' + U.resultado(x, st.tab, { contacto: db.ajustes.contacto }, st.verEnviada) +
      '<div class="row noprint actions"><button class="primary" data-a="imprimir">Imprimir / guardar PDF</button><button class="ghost" data-a="exportar1">Exportar esta entrevista</button>' +
      '<button class="danger" data-a="borrar">' + (st.borrar === x.id ? "Toca de nuevo para borrar" : "Borrar entrevista") + '</button></div></main>';
  }

  /* ---------- Render y eventos ---------- */
  function render() {
    app.innerHTML = st.vista === "lista" ? vLista() : st.vista === "tipo" ? vTipo() : st.vista === "editar" ? vEditar() : vResultado();
    document.body.dataset.vista = st.vista;
    var on = app.querySelector(".secs .on"); if (on && on.scrollIntoView) on.scrollIntoView({ inline: "center", block: "nearest" });
  }
  function tocar(x) { x.actualizado = Date.now(); guardar(); }
  function descargar(nombre, data) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function slug(s) { return String(s || "local").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "local"; }
  function hoy() { return new Date().toISOString().slice(0, 10); }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var x = actual();
    if (x && U.tocarOpcion(b, x)) { tocar(x); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
    var act = b.dataset.a; if (!act) return;
    if (act !== "borrar") st.borrar = null;
    if (act === "nueva") { st.vista = "tipo"; st.base = null; }
    else if (act === "base") { st.base = st.base === b.dataset.id ? null : b.dataset.id; }
    else if (act === "crearTipo") {
      var bx = db.items.filter(function (z) { return z.id === st.base; })[0], v0 = {};
      if (bx) ["nombre", "comuna", "tipo", "entrevistado", "cargo", "permiso", "decide", "usuario"].forEach(function (k) { if (bx.v[k] != null) v0[k] = bx.v[k]; });
      var n = { id: uid(), tipo: b.dataset.tipo, creado: Date.now(), actualizado: Date.now(), v: v0 }; db.items.push(n); guardar(); st.id = n.id; st.sec = 0; st.vista = "editar";
    }
    else if (act === "abrir") { st.id = b.dataset.id; st.sec = 0; st.vista = "editar"; }
    else if (act === "resultado") { st.id = b.dataset.id; st.vista = "resultado"; st.tab = "acta"; st.verEnviada = false; }
    else if (act === "actaVer") { st.verEnviada = !st.verEnviada; }
    else if (U.accionActa(act, x)) { tocar(x); st.verEnviada = false; toast(act === "actaEnviada" ? "Acta registrada como enviada" : "Acta confirmada"); }
    else if (act === "editar") { st.vista = "editar"; }
    else if (act === "lista") { st.vista = "lista"; }
    else if (act === "sec") { st.sec = Number(b.dataset.i); }
    else if (act === "next") { st.sec = Math.min(st.sec + 1, U.numSecs(x) - 1); }
    else if (act === "prev") { st.sec = Math.max(st.sec - 1, 0); }
    else if (act === "tab") { st.tab = b.dataset.t; st.verEnviada = false; }
    else if (act === "imprimir") { window.print(); return; }
    else if (act === "exportar") { descargar("eunomi-levantamientos-" + hoy() + ".json", { app: "eunomi-levantamiento", version: M.version, exportado: new Date().toISOString(), items: db.items }); return; }
    else if (act === "exportar1") { descargar("eunomi-" + slug(x.v.nombre) + "-" + hoy() + ".json", { app: "eunomi-levantamiento", version: M.version, exportado: new Date().toISOString(), items: [x] }); return; }
    else if (act === "borrar") {
      if (st.borrar !== x.id) { st.borrar = x.id; render(); return; }
      db.items = db.items.filter(function (z) { return z.id !== x.id; }); guardar(); st.borrar = null; st.vista = "lista"; toast("Entrevista borrada");
    }
    render(); window.scrollTo(0, 0);
  });

  app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.f) { var x = actual(); x.v[t.dataset.f] = t.value; tocar(x); if (t.dataset.f === "nombre") { var h = app.querySelector(".bar b"); if (h) h.textContent = t.value || "Nueva entrevista"; } }
    else if (t.id === "contacto") { db.ajustes.contacto = t.value; guardar(); }
    else if (t.id === "precio") { var y = actual(); y.P = t.value; tocar(y); var pos = t.selectionStart; render(); var p = document.getElementById("precio"); p.focus(); try { p.setSelectionRange(pos, pos); } catch (er) {} }
  });

  app.addEventListener("change", function (e) {
    if (e.target.id !== "imp" || !e.target.files[0]) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result); if (!d || d.app !== "eunomi-levantamiento" || !Array.isArray(d.items)) throw 0;
        var n = 0; d.items.forEach(function (it) {
          if (!it || !it.id || typeof it.v !== "object") return;
          var i = db.items.findIndex(function (z) { return z.id === it.id; });
          if (i < 0) { db.items.push(it); n++; } else if ((it.actualizado || 0) > (db.items[i].actualizado || 0)) { db.items[i] = it; n++; }
        });
        guardar(); render(); toast(n ? n + " entrevista(s) importada(s)" : "No había nada nuevo");
      } catch (er) { toast("El archivo no es un respaldo de Eunomi"); }
    };
    r.readAsText(e.target.files[0]);
  });

  render();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("/levantamiento-sw.js", { scope: "/levantamiento" }).catch(function () {});
  }
})();

</script>
</body>
</html>
